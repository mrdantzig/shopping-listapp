<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, "Malgun Gothic", sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 32px 16px;
    color: #1f2937;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
  }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
  }
  form button { padding: 10px 16px; background: #2563eb; color: #fff; }
  form button:hover { background: #1d4ed8; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid #e5e7eb;
  }
  li input { width: 18px; height: 18px; cursor: pointer; }
  li span { flex: 1; word-break: break-all; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  li button { background: none; color: #ef4444; font-size: 1.2rem; padding: 2px 8px; }
  li button:hover { background: #fee2e2; }
  .footer {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: .9rem;
    color: #6b7280;
  }
  .footer button { background: none; color: #6b7280; text-decoration: underline; font-size: .9rem; }
  .empty { text-align: center; color: #9ca3af; padding: 24px 0; }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <form id="form">
    <input type="text" id="input" placeholder="사야 할 물건을 입력하세요" autocomplete="off" autofocus>
    <button type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <div class="footer">
    <span id="count"></span>
    <button id="clearDone" type="button">완료 항목 삭제</button>
  </div>
</div>

<script>
  const KEY = "shopping-list";
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const count = document.getElementById("count");

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  function render() {
    list.innerHTML = "";
    if (items.length === 0) {
      list.innerHTML = '<li class="empty" style="justify-content:center;border:none">목록이 비어 있습니다</li>';
    }
    for (const item of items) {
      const li = document.createElement("li");
      if (item.done) li.className = "done";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = item.done;
      cb.onchange = () => { item.done = cb.checked; save(); render(); };

      const span = document.createElement("span");
      span.textContent = item.text;

      const del = document.createElement("button");
      del.textContent = "×";
      del.title = "삭제";
      del.onclick = () => { items = items.filter(i => i.id !== item.id); save(); render(); };

      li.append(cb, span, del);
      list.append(li);
    }
    const done = items.filter(i => i.done).length;
    count.textContent = `${done} / ${items.length} 완료`;
  }

  form.onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, done: false });
    input.value = "";
    save();
    render();
  };

  document.getElementById("clearDone").onclick = () => {
    items = items.filter(i => !i.done);
    save();
    render();
  };

  render();
</script>
</body>
</html>
