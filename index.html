<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --done-bg: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card-bg: #1f2228;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --border: #2b2f36;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --done-bg: #23262c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
  }
  #addBtn {
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
  }
  #addBtn:hover {
    background: var(--accent-hover);
  }
  .filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .filter-row button {
    background: none;
    color: var(--danger);
    font-size: 13px;
    font-weight: 500;
    padding: 4px 6px;
  }
  .filter-row button:hover {
    color: var(--danger-hover);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  li.done {
    background: var(--done-bg);
  }
  li.done .item-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .item-text {
    flex: 1;
    word-break: break-word;
    font-size: 15px;
  }
  .delete-btn {
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .delete-btn:hover {
    background: var(--danger);
    color: #fff;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="subtitle" id="summary">항목이 없습니다</p>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="살 물건을 입력하세요" maxlength="100" autofocus>
      <button id="addBtn">추가</button>
    </div>

    <div class="filter-row">
      <span id="countText"></span>
      <button id="clearDoneBtn">완료 항목 지우기</button>
    </div>

    <ul id="list"></ul>
    <p class="empty" id="emptyMsg" style="display:none;">아직 추가된 항목이 없습니다.</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://nqenxetxxaewnzhrmifq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_MstImiB6DRu6vkJ17SwN9w_Wiyam-Oq';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('itemInput');
  const addBtn = document.getElementById('addBtn');
  const clearDoneBtn = document.getElementById('clearDoneBtn');
  const summaryEl = document.getElementById('summary');
  const countTextEl = document.getElementById('countText');
  const emptyMsg = document.getElementById('emptyMsg');

  let items = [];

  async function loadItems() {
    const { data, error } = await db
      .from('shopping_items')
      .select('*')
      .order('created_at', { ascending: true });
    if (error) {
      console.error(error);
      return;
    }
    items = data;
    render();
  }

  async function addItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const { error } = await db
      .from('shopping_items')
      .insert({ text: trimmed, done: false });
    if (error) {
      console.error(error);
      return;
    }
    await loadItems();
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const { error } = await db
      .from('shopping_items')
      .update({ done: !item.done })
      .eq('id', id);
    if (error) {
      console.error(error);
      return;
    }
    await loadItems();
  }

  async function deleteItem(id) {
    const { error } = await db
      .from('shopping_items')
      .delete()
      .eq('id', id);
    if (error) {
      console.error(error);
      return;
    }
    await loadItems();
  }

  async function clearDone() {
    const { error } = await db
      .from('shopping_items')
      .delete()
      .eq('done', true);
    if (error) {
      console.error(error);
      return;
    }
    await loadItems();
  }

  function render() {
    listEl.innerHTML = '';

    if (items.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
    }

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = item.done;
      checkbox.addEventListener('change', () => toggleItem(item.id));

      const span = document.createElement('span');
      span.className = 'item-text';
      span.textContent = item.text;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '✕';
      delBtn.title = '삭제';
      delBtn.addEventListener('click', () => deleteItem(item.id));

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      listEl.appendChild(li);
    });

    const total = items.length;
    const doneCount = items.filter(i => i.done).length;
    summaryEl.textContent = total === 0 ? '항목이 없습니다' : `총 ${total}개 중 ${doneCount}개 완료`;
    countTextEl.textContent = total > 0 ? `${total - doneCount}개 남음` : '';
  }

  addBtn.addEventListener('click', () => {
    const value = inputEl.value;
    inputEl.value = '';
    inputEl.focus();
    addItem(value);
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const value = inputEl.value;
      inputEl.value = '';
      addItem(value);
    }
  });

  clearDoneBtn.addEventListener('click', clearDone);

  loadItems();
</script>
</body>
</html>
